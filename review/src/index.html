<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stack review</title>
    <link id="favicon" rel="icon" href="data:," />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <aside id="sidebar">
      <section>
        <div class="side-head">
          <span>Stack</span>
          <span id="connection" class="connection" title="Live"></span>
        </div>
        <div id="stack"></div>
      </section>
      <section id="files-section" hidden>
        <div class="side-head"><span>Files</span><span id="files-progress" class="muted"></span></div>
        <div id="files"></div>
      </section>
      <section id="commits-section" hidden>
        <div class="side-head"><span>Commits</span></div>
        <div id="commits"></div>
      </section>
    </aside>
    <main>
      <header id="header"></header>
      <section id="description" hidden>
        <div class="description-body markdown"></div>
        <button class="btn invisible description-toggle" data-act="toggle-description">Show all</button>
      </section>
      <div id="notice"></div>
      <div id="diff"></div>
    </main>
    <div id="submit" hidden>
      <strong>Finish your review of this layer</strong>
      <textarea id="summary" placeholder="Leave an overall comment for Claude (optional)"></textarea>
      <div class="actions">
        <button class="btn" data-act="discard">Discard this layer's comments</button>
        <button class="btn primary" data-act="send">Send to Claude</button>
      </div>
      <div id="submit-list"></div>
    </div>
    <aside id="comments-panel" hidden>
      <div class="panel-head">
        <strong>Comments</strong>
        <span class="spacer"></span>
        <label class="switch"><input type="checkbox" data-toggle="show-sent">Show sent on the diff</label>
        <button class="btn icon invisible" data-act="close-comments" title="Close">✕</button>
      </div>
      <div id="comments-list"></div>
    </aside>
    <script src="app.js"></script>
  </body>
</html>
