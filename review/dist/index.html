<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stack review</title>
    <link id="favicon" rel="icon" href="data:," />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <aside id="sidebar">
      <div id="sidebar-resize" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0" title="Drag to resize, double-click to reset"></div>
      <div id="view-tabs" class="segmented view-tabs" role="radiogroup" aria-label="View"></div>
      <section>
        <div class="side-head">
          <span>Code changes <span id="stack-source" class="stack-source"></span></span>
          <span id="connection" class="connection" title="Connected to Claude Code: this page updates live"></span>
        </div>
        <div id="stack"></div>
      </section>
      <section id="files-section" hidden>
        <div class="side-head"><span>Files</span><span id="files-progress" class="muted"></span></div>
        <div id="files"></div>
      </section>
      <section id="commits-section" hidden>
        <div class="side-head"><span>Commits</span></div>
        <div id="commits"></div>
      </section>
      <section id="versions-section" hidden>
        <div class="side-head"><span>Versions</span></div>
        <div id="versions"></div>
      </section>
    </aside>
    <main>
      <header id="header"></header>
      <section id="description" hidden>
        <div class="description-body markdown"></div>
        <div class="description-actions">
          <button class="btn invisible description-toggle" data-act="toggle-description">Show all</button>
          <button class="btn invisible" data-act="compare-message" hidden title="Show the branch's commit message next to the PR description, with what differs marked"></button>
          <span class="spacer"></span>
          <button class="btn" data-act="describe" title="Select text in the description first to quote it">Comment on description</button>
        </div>
        <div class="description-threads"></div>
      </section>
      <section id="commit-view" hidden></section>
      <div id="notice"></div>
      <div id="diff"></div>
      <section id="conversations" hidden></section>
      <footer class="page-footer"><img src="badge.svg" width="176" height="62" alt="Better uptime than GitHub" /></footer>
    </main>
    <div id="submit" hidden>
      <strong>Finish your review of this layer</strong>
      <textarea id="summary" placeholder="Leave an overall comment for Claude (optional)"></textarea>
      <div class="actions">
        <button class="btn" data-act="discard">Discard this layer's comments</button>
        <button class="btn primary" data-act="send">Send to Claude</button>
      </div>
      <div id="submit-list"></div>
    </div>
    <div id="picker" hidden>
      <div class="picker-head"><strong>Request up to 15 reviewers</strong></div>
      <div class="picker-search"><input type="search" placeholder="Find a user" autocomplete="off" /></div>
      <div class="picker-list"></div>
      <div class="picker-foot muted"></div>
    </div>
    <aside id="comments-panel" hidden>
      <div class="panel-head">
        <strong>Comments</strong>
        <span class="spacer"></span>
        <label class="switch"><input type="checkbox" data-toggle="show-sent">Show sent on the diff</label>
        <label class="switch"><input type="checkbox" data-toggle="show-dismissed">Show dismissed</label>
        <button class="btn icon invisible" data-act="close-comments" title="Close">✕</button>
      </div>
      <div id="comments-list"></div>
    </aside>
    <script src="app.js"></script>
  </body>
</html>
